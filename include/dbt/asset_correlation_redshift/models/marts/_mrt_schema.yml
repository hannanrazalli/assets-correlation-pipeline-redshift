version: 2

models:
  - name: fct_assets
    columns:
      - name: asset_key
        tests:
          - unique
          - not_null
        
      - name: price_date
        tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: price_date

      - name: ticker_symbol
        tests:
          - relationships:
              arguments:
                to: ref('dim_assets')
                field: ticker

      - name: close_price_myr
        tests:
          - not_null

  - name: fct_daily_returns
    columns:
      - name: price_date
        tests:
          - not_null

  - name: fct_asset_correlation
    columns:
      - name: corr_sp500_klse_30d
        tests:
          - not_null

      - name: corr_sp500_btc_30d
        tests:
          - not_null

      - name: corr_sp500_gold_30d
        tests:
          - not_null

      - name: corr_klse_btc_30d
        tests:
          - not_null

      - name: corr_klse_gold_30d
        tests:
          - not_null

      - name: corr_btc_gold_30d
        tests:
          - not_null

      - name: price_date
        tests:
          - not_null