name: 'asset_correlation_redshift'
version: '1.0.0'

profile: 'asset_correlation_redshift'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  asset_correlation_redshift:
    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: view
      +schema: intermediate

    marts:
      +materialized: table
      +schema: marts

      fct_assets:
        +materialized: incremental
        +sort: price_date
        +dist: ticker_symbol
      
      dim_dates:
        +dist: all
      
      fct_assets_rpt:
        +dist: even