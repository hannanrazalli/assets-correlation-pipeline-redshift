name: CI Test Asset Correlation Redshift

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  code_linter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install ruff sqlfluff

      - name: Run test
        run: ruff check dags/ include/

  airflow_dagbag_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test
        run: |
          airflow db migrate
          python -c "
          from airflow.models import DagBag
          dagbag = DagBag(dag_folder='dags/')
          assert len(dagbag.import_errors) == 0, f'DAG Import Errors: {dagbag.import_errors}'
          print('✅ All DAGs successfully uploaded without logic error.')
          "

  dbt_parse_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test
        run: |
          cd include/dbt/asset_correlation_redshift

          cat << EOF > profiles.yml
          asset_correlation_redshift:
            target: dev
            outputs:
              dev:
                type: redshift
                host: localhost
                port: 5439
                user: dummy_user
                pass: dummy_password
                dbname: dev
                schema: dummy_schema
                threads: 1
          EOF

          dbt deps --profiles-dir .
          dbt parse --profiles-dir .
